name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue on ResLocoTransformer! A maintainer
            will take a look soon. In the meantime, please make sure you've included
            enough detail (config used, error output, environment) to reproduce it.
          pr-message: >
            Thanks for your first pull request to ResLocoTransformer! A maintainer
            will review it soon. Please make sure CI is passing and the PR
            description explains the change.
